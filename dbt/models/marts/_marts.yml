version: 2 

models: 
  - name: dim_parameter 
    description: "One row per pollutant in scope, with Indian (NAAQS) and WHO 24-hour standards in ugm3 and in pollutant's own units."
    columns: 
      - name: parameter_id
        description: "OpenAQ parameter ID (natural key)"
        data_tests: [unique, not_null]
      - name: parameter_code
        data_tests: 
          - not_null
          - accepted_values: 
              arguments: 
                values: ['pm10', 'pm25', 'no2']


  - name: dim_date
    description: "Calendar days (local IST), gap-free, from the first reading to the end of next year."
    columns: 
      - name: date_day 
        description: "Calendar date (natural key)."
        data_tests: [unique, not_null]
      - name: season 
        description: "IMD season."
        data_tests: 
          - accepted_values: 
              arguments: 
                values: ['Winter', 'Pre-monsoon', 'Monsoon', 'Post-monsoon']

  - name: dim_location 
    description: "One row per station ever in scope, with its most reacently seen attributes (SCD Type 1). Stations that left scope are kept."
    columns: 
      - name: location_id
        description: "OpenAQ location ID (natural key)."
        data_tests: [unique, not_null]
      - name: city 
        description: "Parsed from the station name and mapped through the city map seed. Null means a new city: Add it to the seed."
        data_tests: [not_null]
      - name: agency 
        data_tests: 
          - accepted_values: 
              arguments: 
                values: ['CPCB', 'DPCC', 'HSPCB', 'IMD', 'IITM', 'MHUA']
              config: 
                severity: warn
      - name: days_since_last_reading
        description: "Days between the station's last reading and build date. Changes on every build."
  - name: dim_sensor
    description: "One row per sensor ever in scope (SCD Type 1)."
    columns: 
      - name: sensor_id
        description: "OpenAQ sensor ID (natural key)."
        data_tests: [unique, not_null]
      - name: location_id 
        data_tests: 
          - not_null
          - relationships: 
              arguments: 
                to: ref('dim_location')
                field: location_id
      - name: parameter_id 
        data_tests: 
          - not_null
          - relationships: 
              arguments: 
                to: ref('dim_parameter')
                field: parameter_id

