version: 2 

sources: 
  - name: curated 
    description: "Clean hourly readings written by Spark transform (vayu_transform)."
    meta: 
      external_location: "read_parquet('s3://curated/openaq/hours/**/*.parquet', hive_partitioning=true)"
    tables: 
      - name: hours
        description: "One row per session per hour. Hard rejects are excluded; soft flags in quality_flags."

  - name: raw_metadata 
    description: "Daily station and sensor metadata snapshots written by discovery (vayu_extract)."
    tables: 
      - name: snapshots 
        description: "One file per day: in-scope stations (raw API records) and selected sensors."
        meta: 
          external_location: "read_json('s3://raw/openaq/metadata/snapshot_date=*/stations.json', hive_partitioning=true, union_by_name=true)"

  - name: rejected 
    description: "Readings rejected by the spark transform, each with one primary reject_reason."
    tables: 
      - name: hours 
        meta: 
          external_location: "read_parquet('s3://rejected/openaq/hours/*.parquet')"